<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Progress</title>
    <style>
        .images-content1 {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 20px;
        }

        .skills-image {
            display: flex;
            flex-direction: row;
            align-items: center;
            text-align: left;
            margin: 10px;
            width: 23%; /* Adjust width to fit 4 items in one row */
            background-color: #f9f9f9;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .skills-image img {
            width: 80px;
            height: auto;
            margin-right: 10px;
            border-radius: 4px;
        }

        .skills-details {
            display: flex;
            flex-direction: column;
            justify-content: center;
            width: 100%;
        }

        .skills-details p {
            font-weight: bold;
            margin: 0 0 8px;
        }

        .score_fill {
            position: relative;
            width: 100%;
            background-color: black;
            border: 1px solid #ccc;
            border-radius: 10px;
            height: 20px;
            overflow: hidden;
        }

        .progress-bar {
            background-color: #4caf50;
            height: 100%;
            width: 0%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: width 0.5s ease;
        }

        .score_percentage {
            color: #fff;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="images-content">
        <div class="images-content1">
            <!-- TYPING -->
            <div class="skills-image">
                <img src="./Assests/images/typing_image.jpg" alt="Typing">
                <div class="skills-details">
                    <p>TYPING</p>
                    <div class="score_fill">
                        <div class="progress-bar" style="width: 75%;">
                            <span class="score_percentage">75%</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ENGLISH -->
            <div class="skills-image">
                <img src="./Assests/images/english_img.jpg" alt="English">
                <div class="skills-details">
                    <p>ENGLISH</p>
                    <div class="score_fill">
                        <div class="progress-bar" style="width: 50%;">
                            <span class="score_percentage">50%</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- LIFE SKILLS -->
            <div class="skills-image">
                <img src="/Assests/images/lifeSkill_image.jpg" alt="Life Skills">
                <div class="skills-details">
                    <p>LIFE SKILLS</p>
                    <div class="score_fill">
                        <div class="progress-bar" style="width: 50%;">
                            <span class="score_percentage">50%</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- HTML -->
            <div class="skills-image">
                <img src="./Assests/images/html_image4.jpg" alt="HTML">
                <div class="skills-details">
                    <p>HTML</p>
                    <div class="score_fill">
                        <div class="progress-bar" style="width: 50%;">
                            <span class="score_percentage">50%</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- CSS -->
            <div class="skills-image">
                <img src="./Assests/images/css_image.jpg" alt="CSS">
                <div class="skills-details">
                    <p>CSS</p>
                    <div class="score_fill">
                        <div class="progress-bar" style="width: 50%;">
                            <span class="score_percentage">50%</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- JAVASCRIPT -->
            <div class="skills-image">
                <img src="./Assests/images/JavaScript-image1.png" alt="JavaScript">
                <div class="skills-details">
                    <p>JAVASCRIPT</p>
                    <div class="score_fill">
                        <div class="progress-bar" style="width: 50%;">
                            <span class="score_percentage">50%</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- MYSQL -->
            <div class="skills-image">
                <img src="./Assests/images/my_sql_image.png" alt="MySQL">
                <div class="skills-details">
                    <p>MYSQL</p>
                    <div class="score_fill">
                        <div class="progress-bar" style="width: 50%;">
                            <span class="score_percentage">50%</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- PYTHON -->
            <div class="skills-image">
                <img src="./Assests/images/python_image.png" alt="Python">
                <div class="skills-details">
                    <p>PYTHON</p>
                    <div class="score_fill">
                        <div class="progress-bar" style="width: 50%;">
                            <span class="score_percentage">50%</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
