<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        /* Container for the image and overlay */
.image-container {
    position: relative;
    display: inline-block;
    width: 200px; /* Adjust width as needed */
    height: 150px; /* Adjust height as needed */
    margin: 10px;
    cursor: pointer;
    overflow: hidden;
}

/* Style the image */
.image-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.3s ease; /* Smooth zoom on hover */
}

/* Style the overlay */
.image-container .overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.7); /* Semi-transparent background */
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    font-size: 16px;
    padding: 10px;
    opacity: 0; /* Hidden by default */
    transition: opacity 0.3s ease;
}

/* Hover effect for the image */
.image-container:hover img {
    transform: scale(1.1); /* Zoom in on hover */
}

/* Hover effect for the overlay */
.image-container:hover .overlay {
    opacity: 1; /* Show the overlay */
}

    </style>
</head>
<body>
    <div class="project_head">
        <!-- First Image -->
        <div class="image-container">
            <img src="/Assests/images/css.png" alt="CSS Project">
            <div class="overlay">
                <p>CSS Project: Click to view the website</p>
            </div>
        </div>
    
        <!-- Second Image -->
        <div class="image-container">
            <img src="/Assests/images/Screenshot (1).png" alt="Screenshot Project">
            <div class="overlay">
                <p>Screenshot Project: Click to explore</p>
            </div>
        </div>
    </div>

    <script>
        // Select all image containers
const imageContainers = document.querySelectorAll('.image-container');

// Add a click event listener to each container
imageContainers.forEach(container => {
    container.addEventListener('click', () => {
        // Redirect based on the project
        if (container.querySelector('img').alt === 'CSS Project') {
            window.location.href = 'https://your-css-project-url.com';
        } else if (container.querySelector('img').alt === 'Screenshot Project') {
            window.location.href = 'https://your-screenshot-project-url.com';
        }
    });
});

    </script>
    
</body>
</html>
